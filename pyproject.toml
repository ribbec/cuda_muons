[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-muons"
version = "0.1.0"
description = "GPU muon transport: kernel wrappers, scattering tables and fitted beam models"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "torch",
    "h5py",
]

# The CUDA extension itself (`fastermuons`) is built separately from
# faster_muons_torch/ and installed as its own wheel.
[project.optional-dependencies]
beam = ["scikit-learn", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cuda_muons = ["data/*.pkl", "data/*.txt", "data/gmm/*.pkl"]
